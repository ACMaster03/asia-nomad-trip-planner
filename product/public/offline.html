<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>Offline — Asia Nomad Planner</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a; color: #e5e5e5; text-align: center; }
  @media (prefers-color-scheme: light) { body { background: #fafafa; color: #171717; } }
  .card { padding: 2rem; max-width: 22rem; }
  .compass { font-size: 3rem; }
  h1 { font-size: 1.25rem; margin: .75rem 0 .25rem; }
  p { font-size: .9rem; color: #8a8a8a; line-height: 1.5; }
  button { margin-top: 1.25rem; padding: .6rem 1.4rem; font-size: .9rem; font-weight: 500;
    color: #fff; background: #0d9488; border: 0; border-radius: .5rem; }
</style>
</head>
<body>
<div class="card">
  <div class="compass">🧭</div>
  <h1>You’re offline</h1>
  <p>This screen hasn’t been cached yet. Screens you visited while online stay readable offline, and Live check-ins queue up and sync when you’re back.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
