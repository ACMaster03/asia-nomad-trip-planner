<!doctype html>
<!-- WebKit bug 323307: Safari 26's UI process (MobileSafari / Safari itself, not the
     page) crashes with EXC_BAD_ACCESS at 0xc in WebCore::blend(TransformOperation),
     called from WebKit::RemoteAnimationStack::computeValues, as soon as a box with
     this animation is in view. The trigger is a scroll-driven animation whose active
     keyframe interval has `none` at both ends for `scale` (or `translate`, or `rotate`).
     Found by Livhold (docs/NOTES.md, 25 Oct 2026), iOS 26.5 Simulator.
     Does not crash: the same keyframes on a time-based animation; `scale: .96` → `none`;
     `scale: 1` in place of `none`; `transform: none`. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @keyframes hold { from { scale: none } to { scale: none } }
  .box { height: 120px; margin: 12px; background: #4a7; animation: hold linear both; animation-timeline: view(); }
</style>
<div class="box"></div>
<div style="height: 2000px"></div>
